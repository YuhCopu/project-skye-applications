<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skye Applications</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8ecf5;background:#090b0f}*{box-sizing:border-box}body{margin:0;background:#090b0f}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}aside{width:210px;background:#0d1015;border-right:1px solid #1c2028;padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:2px 7px 18px}.logo{width:34px;height:34px;border-radius:9px;background:#151a25;border:1px solid #283149;display:grid;place-items:center;color:#afbeff;font-size:18px}.brand b{display:block}.brand small{display:block;color:#697284;font-size:10px;margin-top:2px}.status{font-size:10px;color:#7f899b;border:1px solid #1d2430;border-radius:7px;padding:8px;margin-bottom:12px}.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#67d694;margin-right:6px}nav{display:grid;gap:3px}nav button{border:0;background:none;color:#7e8798;text-align:left;padding:9px 10px;border-radius:7px;font-size:11px}nav button:hover,nav button.on{background:#171b23;color:#eef2fb}nav button.on{box-shadow:inset 2px 0 #aebfff}.side{margin-top:auto;color:#4e5665;font-size:8px;line-height:1.7;padding:8px}main{flex:1;min-width:0}header{height:70px;border-bottom:1px solid #1c2028;padding:0 25px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:8px;letter-spacing:.16em;color:#687183}h1{font-size:20px;margin:4px 0}.head{display:flex;gap:8px;align-items:center}.btn{border:1px solid #293142;background:#141820;color:#dfe5f2;border-radius:7px;padding:8px 11px;font-size:11px}.btn.primary{background:#aebfff;color:#080a0e;border-color:#aebfff;font-weight:700}.btn.danger{color:#ff9da9;border-color:#45242c}.saving{font-size:10px;color:#aebfff;min-width:62px;text-align:right}.saving:after{content:'.';animation:dots 1.1s steps(1) infinite}@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}.content{padding:23px 25px;max-width:1120px}.hero{border:1px solid #202632;background:#0e1218;border-radius:11px;padding:23px;display:flex;justify-content:space-between;gap:20px}.tag{font-size:8px;color:#73d99a;letter-spacing:.14em}.hero h2{font-size:25px;margin:9px 0 6px}.hero p{font-size:11px;color:#7c8595;max-width:600px}.actions{display:flex;gap:7px;margin-top:16px}.flow{display:flex;gap:8px;align-items:center;color:#a7afbf;font-size:10px;align-self:center}.flow b{color:#4b5362}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}.stat,.card{border:1px solid #1c222c;background:#0e1218;border-radius:9px}.stat{padding:13px}.stat small{display:block;color:#697284;font-size:9px}.stat b{font-size:21px;display:block;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.card h2{font-size:15px;margin:0}.card h3{font-size:12px;margin:0 0 12px}.muted{color:#6e7788;font-size:10px}.mini{display:flex;gap:9px;align-items:center;padding:9px 0;border-top:1px solid #191e26}.mini .emoji{font-size:15px}.mini div{flex:1}.mini b,.mini small{display:block}.mini small{font-size:9px;color:#697284;margin-top:2px}.green{color:#6fd394;font-size:9px}.decisions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.decisions span{border:1px solid #232a36;border-radius:6px;padding:9px;color:#aeb6c5;font-size:9px}.layout{display:grid;grid-template-columns:210px 1fr;gap:10px}.list{padding:7px}.type{width:100%;border:0;background:none;color:#aab2c2;text-align:left;padding:10px;border-radius:7px;display:flex;gap:8px;align-items:center}.type:hover,.type.active{background:#171c25;color:#eef2fb}.type div{flex:1}.type b,.type small{display:block}.type small{font-size:9px;color:#687183;margin-top:2px}.dot{width:6px;height:6px;background:#6fd394;border-radius:50%}.add{width:100%;margin-top:4px;background:none;border:1px dashed #2a3140;color:#7b8494;border-radius:7px;padding:8px;font-size:10px}.editorTop{display:flex;justify-content:space-between}.editorTop p{font-size:9px;color:#687183}.fields,.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.field{display:grid;gap:5px;color:#778092;font-size:9px}.wide{grid-column:1/-1}.field input,.field textarea,.q input,.search input{background:#0a0d12;color:#e9edf6;border:1px solid #252d39;border-radius:6px;padding:8px;font-size:10px;outline:0}.field textarea{min-height:60px;resize:vertical}.check{display:flex;align-items:center;gap:7px;color:#8b94a5;font-size:10px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.q{display:grid;grid-template-columns:25px 1fr 30px;gap:6px;align-items:center;margin:5px 0}.q span{text-align:center;color:#687183;font-size:9px}.q button{border:0;background:none;color:#687183}.full{margin-top:12px}.search{display:flex;align-items:center;gap:7px;max-width:450px;border:1px solid #252d39;background:#0e1218;border-radius:7px;padding:8px 10px;margin-bottom:10px;color:#6c7585}.search input{border:0;background:none;padding:0;flex:1}.table{padding:0;overflow:hidden}.tr{display:grid;grid-template-columns:1.2fr 1fr 1fr .8fr .8fr;gap:10px;padding:10px 13px;border-top:1px solid #191e27;font-size:10px;align-items:center}.th{border:0;background:#10141b;color:#626b7b;font-size:8px}.pending{color:#dec47b}.accepted{color:#70d497}.denied{color:#e18490}.settingsCard{max-width:800px}.settingsCard h2{font-size:15px}.message{border-top:1px solid #1b2028;margin-top:18px;padding-top:15px;display:grid;gap:10px}.message textarea{min-height:68px}.toast{position:fixed;right:18px;bottom:18px;background:#151b24;border:1px solid #2b3546;border-radius:8px;padding:10px 12px;font-size:10px;box-shadow:0 15px 35px #0009}.error{margin:12px 25px 0;padding:9px;border:1px solid #48252d;background:#211418;color:#ffadb7;border-radius:7px;font-size:10px}.empty{text-align:center;padding:28px;color:#687183;font-size:10px}@media(max-width:800px){aside{width:64px}.brand div:not(.logo),.status,.side,nav button span{display:none}nav button{text-align:center}.content{padding:16px}.hero{display:block}.flow{margin-top:18px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.layout,.fields,.settings{grid-template-columns:1fr}.tr{grid-template-columns:1.2fr 1fr 1fr}.tr span:nth-child(4),.tr span:nth-child(5),.th span:nth-child(4),.th span:nth-child(5){display:none}}
</style></head><body><div class="app"><aside><div class="brand"><div class="logo">☁</div><div><b>Skye</b><small>Applications</small></div></div><div class="status"><i></i> Bot connected</div><nav id="nav"></nav><div class="side">LOCAL CONTROL PANEL<br>Bot + dashboard</div></aside><main><header><div><span class="eyebrow">SKYE CONTROL</span><h1 id="title">Overview</h1></div><div class="head"><span id="who" class="muted"></span><span id="saving"></span><button class="btn" id="reload">↻</button><button class="btn primary" id="save">Save</button><a class="btn" href="/logout">Logout</a></div></header><div id="error"></div><div id="content"></div></main></div><div id="toast"></div><script>
const A='/api';let cfg=null,subs=[],page='home',selected='';let saving=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setError(x=''){ $('#error').innerHTML=x?`<div class="error">${esc(x)}</div>`:'' }function toast(x){$('#toast').innerHTML=`<div class="toast">✓ ${esc(x)}</div>`;setTimeout(()=>$('#toast').innerHTML='',2200)}function loading(v){saving=v;$('#saving').textContent=v?'Loading':'';if(v)$('#saving').className='saving';else $('#saving').className=''}
async function api(url,opt){const r=await fetch(A+url,opt);if(!r.ok)throw new Error(await r.text()||'Request failed');return r.json()}
async function load(){setError('');try{const me=await api('/me');$('#who').textContent=`${me.user.global_name||me.user.username} · trusted`;[cfg,subs]=await Promise.all([api('/config'),api('/submissions')]);selected=selected||cfg.applicationTypes[0]?.id;render()}catch(e){setError('Dashboard authentication is required, or the Skye bot is offline.')}}
async function save(){if(!cfg||saving)return;loading(true);try{cfg=await api('/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});toast('Saved to the live bot configuration.')}catch(e){setError(e.message)}finally{loading(false)}}
async function publish(){const id=prompt('Discord channel ID to post the application panel in:');if(!id)return;loading(true);try{await api('/publish-panel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channelId:id})});toast('Panel posted to Discord.')}catch(e){setError(e.message)}finally{loading(false)}}
function nav(){const items=[['home','⌂','Overview'],['applications','☷','Applications'],['submissions','▤','Submissions'],['settings','⚙','Settings']];$('#nav').innerHTML=items.map(x=>`<button class="${page===x[0]?'on':''}" data-page="${x[0]}">${x[1]} <span>${x[2]}</span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function render(){nav();$('#title').textContent={home:'Overview',applications:'Applications',submissions:'Submissions',settings:'Settings'}[page];if(page==='home')home();if(page==='applications')applications();if(page==='submissions')submissions();if(page==='settings')settings()}
function home(){$('#content').innerHTML=`<section class="content"><div class="hero"><div><span class="tag">● ONLINE</span><h2>Everything in one place.</h2><p>Configure applications here; applicants still complete everything privately in Discord DMs.</p><div class="actions"><button class="btn primary" id="publish">↗ Post panel</button><button class="btn" id="apps">Edit applications</button></div></div><div class="flow"><span>Panel</span><b>→</b><span>DMs</span><b>→</b><span>Review</span><b>→</b><span>Decision</span></div></div><div class="stats"><div class="stat"><small>Total</small><b>${subs.length}</b></div><div class="stat"><small>Pending</small><b>${subs.filter(x=>x.status==='Pending').length}</b></div><div class="stat"><small>Accepted</small><b>${subs.filter(x=>x.status==='Accepted').length}</b></div><div class="stat"><small>Denied</small><b>${subs.filter(x=>x.status==='Denied').length}</b></div><div class="stat"><small>Active types</small><b>${cfg.applicationTypes.filter(x=>x.active!==false).length}</b></div></div><div class="grid"><div class="card"><h3>Application types</h3>${cfg.applicationTypes.map(a=>`<div class="mini"><span class="emoji">${esc(a.emoji)}</span><div><b>${esc(a.name)}</b><small>${a.questions.length} questions</small></div><span class="green">${a.active===false?'Off':'Active'}</span></div>`).join('')}</div><div class="card"><h3>Review controls</h3><p class="muted">Every Discord submission gets native review buttons.</p><div class="decisions"><span>✓ Accept</span><span>✓ Accept with Reason</span><span>× Deny</span><span>× Deny with Reason</span></div></div></div></section>`;$('#publish').onclick=publish;$('#apps').onclick=()=>{page='applications';render()}}
function applications(){const a=cfg.applicationTypes.find(x=>x.id===selected)||cfg.applicationTypes[0];selected=a?.id||'';$('#content').innerHTML=`<section class="content"><div class="layout"><div class="card list">${cfg.applicationTypes.map(x=>`<button class="type ${x.id===selected?'active':''}" data-type="${esc(x.id)}"><span>${esc(x.emoji)}</span><div><b>${esc(x.name)}</b><small>${x.questions.length} questions</small></div>${x.active!==false?'<i class="dot"></i>':''}</button>`).join('')}<button class="add" id="add">＋ New type</button></div><div class="card"><div class="editorTop"><div><h2>${esc(a.name)}</h2><p>These are the real questions the bot asks in DMs.</p></div><button class="btn danger" id="remove">Delete</button></div><div class="fields"><label class="field">Name<input id="aname" value="${esc(a.name)}"></label><label class="field">Emoji<input id="aemoji" value="${esc(a.emoji)}"></label><label class="field wide">Description<textarea id="adesc">${esc(a.description)}</textarea></label><label class="check"><input id="active" type="checkbox" ${a.active!==false?'checked':''}> Enabled</label></div><div class="sectionhead"><div><b>Questions</b><div class="muted">Every question is sent separately in DMs.</div></div><button class="btn" id="addq">＋ Add</button></div>${a.questions.map((q,i)=>`<div class="q"><span>${i+1}</span><input data-q="${i}" value="${esc(q)}"><button data-del="${i}">×</button></div>`).join('')}<button class="btn primary full" id="saveApp">Save application type</button></div></div></section>`;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selected=b.dataset.type;render()});$('#add').onclick=()=>{const n={id:'custom-'+Date.now(),name:'New Application',emoji:'📋',description:'',active:true,questions:['What would you like us to know?'],roles:{onSubmit:[],onAccept:[],onDeny:[],removeOnAccept:[],removeOnDeny:[]}};cfg.applicationTypes.push(n);selected=n.id;render()};$('#remove').onclick=()=>{if(cfg.applicationTypes.length<2)return alert('Keep at least one application type.');if(confirm('Delete this application type?')){cfg.applicationTypes=cfg.applicationTypes.filter(x=>x.id!==a.id);selected=cfg.applicationTypes[0].id;render()}};$('#aname').oninput=e=>a.name=e.target.value;$('#aemoji').oninput=e=>a.emoji=e.target.value;$('#adesc').oninput=e=>a.description=e.target.value;$('#active').onchange=e=>a.active=e.target.checked;document.querySelectorAll('[data-q]').forEach(i=>i.oninput=e=>a.questions[Number(i.dataset.q)]=e.target.value);document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{a.questions.splice(Number(b.dataset.del),1);render()});$('#addq').onclick=()=>{a.questions.push('New question');render()};$('#saveApp').onclick=save}
function submissions(){let q='';$('#content').innerHTML=`<section class="content"><div class="search">⌕<input id="search" placeholder="Search ID, applicant, type, status…"></div><div class="card table" id="table"></div></section>`;const draw=()=>{q=$('#search').value.toLowerCase();const rows=subs.filter(x=>`${x.id} ${x.username} ${x.type} ${x.status}`.toLowerCase().includes(q));$('#table').innerHTML=`<div class="tr th"><span>Application</span><span>Applicant</span><span>Type</span><span>Status</span><span>Date</span></div>${rows.length?rows.map(x=>`<div class="tr"><b>${esc(x.id)}</b><span>${esc(x.username)}</span><span>${esc(x.type)}</span><span class="${x.status.toLowerCase()}">${esc(x.status)}</span><span>${new Date(x.submittedAt).toLocaleDateString()}</span></div>`).join(''):'<div class="empty">No applications found.</div>'}`};$('#search').oninput=draw;draw()}
function settings(){const c=cfg;$('#content').innerHTML=`<section class="content"><div class="card settingsCard"><h2>Discord settings</h2><p class="muted">These values are saved directly into the bot configuration.</p><div class="settings"><label class="field">Panel title<input id="pt" value="${esc(c.panel.title)}"></label><label class="field">Review role ID<input id="rr" value="${esc(c.reviewRoleId)}" placeholder="Discord role ID"></label><label class="field wide">Panel description<textarea id="pd">${esc(c.panel.description)}</textarea></label>${Object.keys(c.channels).map(k=>`<label class="field">${esc(k)} channel ID<input data-ch="${esc(k)}" value="${esc(c.channels[k])}" placeholder="Discord channel ID"></label>`).join('')}</div><div class="message"><b>DM messages</b>${Object.entries(c.messages).map(([k,v])=>`<label class="field">${esc(k)}<textarea data-msg="${esc(k)}">${esc(v)}</textarea></label>`).join('')}</div><div class="message"><b>Trusted dashboard users</b><p class="muted">Discord OAuth proves who is signing in; only IDs listed here can enter the dashboard.</p><div style="display:flex;gap:7px"><input id="trustId" placeholder="Discord user ID" style="flex:1;background:#0a0d12;color:#e9edf6;border:1px solid #252d39;border-radius:6px;padding:8px;font-size:10px"><button class="btn primary" id="trustAdd">Add trusted user</button></div><div id="trustedList" style="margin-top:8px"></div></div></div></section>`;$('#pt').oninput=e=>c.panel.title=e.target.value;$('#pd').oninput=e=>c.panel.description=e.target.value;$('#rr').oninput=e=>c.reviewRoleId=e.target.value;document.querySelectorAll('[data-ch]').forEach(i=>i.oninput=e=>c.channels[i.dataset.ch]=e.target.value);document.querySelectorAll('[data-msg]').forEach(i=>i.oninput=e=>c.messages[i.dataset.msg]=e.target.value);const drawTrusted=()=>{$('#trustedList').innerHTML=(c.trustedUserIds||[]).map(id=>`<div class="mini"><div><b>${esc(id)}</b><small>Discord user ID</small></div><button class="btn danger" data-untrust="${esc(id)}">Remove</button></div>`).join('')||'<div class="muted">No trusted users configured.</div>';document.querySelectorAll('[data-untrust]').forEach(b=>b.onclick=async()=>{loading(true);try{await api('/trusted?userId='+encodeURIComponent(b.dataset.untrust),{method:'DELETE'});c.trustedUserIds=c.trustedUserIds.filter(x=>x!==b.dataset.untrust);drawTrusted();toast('Trusted user removed.')}catch(e){setError(e.message)}finally{loading(false)}})};$('#trustAdd').onclick=async()=>{const id=$('#trustId').value.trim();if(!id)return;loading(true);try{const r=await api('/trusted',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:id})});c.trustedUserIds=r.users;$('#trustId').value='';drawTrusted();toast('Trusted user added.')}catch(e){setError(e.message)}finally{loading(false)}};drawTrusted()}
$('#save').onclick=save;$('#reload').onclick=load;load();
</script></body></html>
